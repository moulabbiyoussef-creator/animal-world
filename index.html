<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#cfdcda;color:#24343a;font-family:Arial,sans-serif}
body{overflow-x:hidden}
.app{width:min(430px,100%);min-height:100dvh;margin:auto;background:#dce8e6;box-shadow:0 4px 24px #0002;position:relative}
header{height:58px;min-height:58px;background:#d1dfdd;border-bottom:1px solid #c3d2d0;display:flex;position:sticky;top:0;z-index:100;align-items:center;justify-content:space-between;padding:10px 14px}

.homeHead{margin:0!important;flex:0 0 44px!important;width:44px!important;height:44px!important;background:#fff!important;color:#24434a!important;box-shadow:0 2px 6px #0002;display:flex!important;align-items:center;justify-content:center}.iconBtn{width:44px!important;height:44px!important;margin:0!important;padding:0!important;border-radius:13px!important;background:#fff!important;font-size:21px!important;box-shadow:0 2px 5px #0002}
.screen{min-height:calc(100dvh - 58px);height:calc(100dvh - 58px);padding:7px 12px 9px;text-align:center;overflow:hidden}
.hidden{display:none!important}
h1{font-size:25px;margin:4px 0 4px}h2{margin:2px 0 2px}h3{margin:0 0 7px}
.sub{color:#637376;line-height:1.35;margin:4px 0 9px}.small{font-size:13px;color:#657578}
button{border:0;border-radius:16px;padding:11px 15px;margin:4px;width:92%;font-size:16px;font-weight:900;background:#e8c75d;color:#24343a;cursor:pointer}
button.secondary{background:#fff;border:1px solid #cdd9d8}
button:disabled{opacity:.55;cursor:default}
.card{background:#fff;border:1px solid #d0dcdb;border-radius:18px;padding:10px;margin:6px 0;box-shadow:0 2px 8px #0000000b}
.animal{font-size:86px;display:inline-block;margin:3px 0;animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px) rotate(-2deg)}}
.progress{height:9px;background:#c6d4d2;border-radius:9px;overflow:hidden;margin:7px 0 10px}.bar{height:100%;background:#e8c75d;width:0;transition:.3s}
.word{font-size:34px;font-weight:950;margin:4px 0;line-height:1.2}
.native{font-size:19px;color:#68777a;margin:5px 0 12px}
.sound{width:66px;height:66px;border-radius:50%;padding:0;margin:5px;font-size:29px;background:#fff;border:1px solid #ccd9d8}
.sound.voice{background:#fffaf0;border-color:#e8c75d}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:9px 0}
.choice{width:100%;margin:0;min-height:62px;padding:5px 3px;background:#fff;border:2px solid #c9d7d5;color:#17272c;font-size:51px;font-weight:950}
.feedback{min-height:30px;margin:9px;font-weight:900}.ok{color:#2f7d3b}.bad{color:#a45d23}
.settingsBox{background:#fff;border:1px solid #d0dcdb;border-radius:20px;padding:14px;margin:10px 0;text-align:right}
.settingsBox strong{display:block;margin-bottom:8px}.settingsBox button{width:auto;margin:4px;padding:11px 13px;font-size:15px;background:#fff;border:1px solid #d0dcdb}
.settingsBox button.selected{outline:3px solid #e8c75d;background:#fffaf0}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid #d0dcdb;border-radius:18px;padding:13px}.stat b{display:block;font-size:24px}
.wordDisplay{display:flex;justify-content:center;align-items:center;gap:3px;direction:ltr;flex-wrap:nowrap;overflow:hidden;min-height:54px;margin:7px 0}
.wordDisplay.rtl{direction:rtl}.letterBox{width:clamp(27px,9vw,42px);height:48px;border-radius:11px;background:#fff;border:3px solid #d7e0df;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,7vw,33px);font-weight:950;flex:0 1 auto}
.letterBox.missing{border-color:#e8c75d;background:#fffaf0}.letterBox.correct{border-color:#48a05a;background:#e8f6ea;color:#277438}.letterBox.wrong{border-color:#d48b4d;background:#fff0e5;color:#a55220}
.letterChoices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:330px;margin:auto}.letterChoice{width:100%;height:58px;margin:0;background:#fff;border:2px solid #c9d7d5;font-size:35px;font-weight:950}
.reviewCard{text-align:right;background:#fff;border:1px solid #d0dcdb;border-radius:18px;padding:13px;margin:9px 0}.reviewTop{display:flex;justify-content:space-between;align-items:center}.miniAnimal{font-size:43px}
.badge{display:inline-block;background:#fff;border-radius:14px;padding:8px 12px;margin:4px;font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#24343a;color:#fff;padding:10px 15px;border-radius:13px;display:none;z-index:50}
.navRow{display:flex;gap:6px;margin-top:7px}.navRow button{flex:1;width:auto;margin:0;font-size:14px;padding:9px 6px}
.settingsTop{height:42px;display:flex;align-items:center;justify-content:flex-start;margin-bottom:2px}
.settingsBack{width:44px!important;height:40px!important;margin:0!important;padding:0!important;background:#f1c75b!important;color:#20363b!important;font-size:25px!important;border-radius:13px!important;box-shadow:0 2px 6px #0002}
#settings .settingsBox{margin:6px 0;padding:9px 10px}
#settings .screenTitle,#settings .settingsTitle{display:none!important}
@media (max-height:720px){
  .settingsTop{height:36px}
  .settingsBack{height:36px!important}
  #settings .settingsBox{margin:4px 0;padding:7px 9px}
}

body > .app > header{
  min-height:68px!important;

}

<style id="AW_HOME_REMOVE_LOWER_PROTOTYPE">

<style id="AW_HOME_ATTRACTIVE_SIMPLE">
/* Home V2: calm, universal language-learning visual; minimal text. */
#home{padding:8px 12px 10px!important;background:linear-gradient(180deg,#c7d6e4 0%,#b8cbdc 100%)!important;}
.awHomeClean{height:100%;min-height:0;display:flex;flex-direction:column;gap:10px;}
.awHomeVisual{
  position:relative;flex:0 0 205px;border-radius:25px;overflow:hidden;
  background:linear-gradient(145deg,#f2ca55 0%,#e9b63c 100%);
  border:2px solid #d8a62c;box-shadow:0 5px 16px #00000012;
  display:flex;align-items:center;justify-content:center;
}
.awHomeVisual:before{
  content:"";position:absolute;width:190px;height:190px;border-radius:50%;
  background:#ffffff55;top:-105px;right:-55px;
}
.awHomeVisual:after{
  content:"";position:absolute;width:150px;height:150px;border-radius:50%;
  background:#ffffff3d;bottom:-95px;left:-55px;
}
.awSky{position:absolute;inset:0;z-index:1;text-align:center;font-size:0;opacity:1;}
.awSky:before{content:"📖";position:absolute;left:12%;top:34%;font-size:34px;transform:rotate(-8deg);filter:drop-shadow(0 4px 4px #0001);}
.awSky:after{content:"🔤";position:absolute;right:13%;top:28%;font-size:31px;transform:rotate(7deg);filter:drop-shadow(0 4px 4px #0001);}
.awScene{
  position:relative;z-index:2;font-size:68px;letter-spacing:5px;margin:0;
  filter:drop-shadow(0 6px 5px #0001);
  animation:awLearnFloat 3.8s ease-in-out infinite;
}
@keyframes awLearnFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.awHomeBrand{
  position:absolute;z-index:3;top:13px;left:0;right:0;text-align:center;
  font-size:19px;font-weight:950;color:#31534d;
}
.awHomeBrand span{
  background:#ffffffd9;border:1px solid #ffffffaa;padding:7px 13px;
  border-radius:999px;box-shadow:0 3px 8px #00000010;
}
.awHomeStartCard{background:#ffffffed;border:1px solid #d3dfdc;border-radius:22px;padding:10px;box-shadow:0 4px 13px #0000000c;}
.awStartMain{
  width:100%!important;margin:0!important;padding:14px 12px!important;border-radius:18px!important;
  background:linear-gradient(145deg,#f2ca55,#e9b63c)!important;border:2px solid #d8a62c!important;
  color:#24343a!important;font-size:20px!important;font-weight:950!important;
  box-shadow:0 5px 0 #c99927,0 7px 12px #0002!important;
}
.awStartMain:active{transform:translateY(3px);box-shadow:0 2px 0 #c99927,0 4px 8px #0002!important;}
.awStartSub{display:block;text-align:center;margin-top:7px;font-size:12px;font-weight:800;color:#6b797b;}
.awHomeActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.awHomeActions button{
  width:100%!important;margin:0!important;padding:11px 8px!important;background:#fff!important;
  border:1px solid #d0ddda!important;border-radius:17px!important;box-shadow:0 3px 9px #0000000b!important;font-size:14px!important;
}
.awHomeActions button:first-child{background:#e9f3ef!important;}
.awHomeFuture{flex:1;min-height:120px;border-radius:21px;border:1.5px dashed #bfd0cd;background:#ffffff50;}
.awLegacyHomeData{display:none!important;}
@media(max-height:720px){
  .awHomeVisual{flex-basis:170px}.awScene{font-size:55px}.awHomeClean{gap:7px}
  .awHomeFuture{min-height:70px}.awStartMain{padding:11px!important}.awStartSub{margin-top:4px}
}

  lion:{id:'lion',visual:'🦁',animation:null,image:null,names:{en:'Lion',fr:'Lion',ar:'الأسد'},speech:{ar:'الأَسَدُ'},audio:null},

});

/* APP-WIDE VOICE POLICY:
   Arabic learning uses Modern Standard Arabic (العربية الفصحى).
   We request generic "ar" and never hard-code a Moroccan/Egyptian/Saudi/etc. locale. */
let cachedArabicVoice=null;
let arabicVoicesReady=false;

function refreshArabicVoices(){
  if(!('speechSynthesis' in window))return;
  const voices=speechSynthesis.getVoices()||[];
  cachedArabicVoice=
    voices.find(v=>(v.lang||'').toLowerCase()==='ar')||
    voices.find(v=>{
      const l=(v.lang||'').toLowerCase(),n=(v.name||'').toLowerCase();
      return l.startsWith('ar-')&&/(standard|msa|modern|classical|fusha|arabic)/i.test(n);
    })||
    voices.find(v=>(v.lang||'').toLowerCase().startsWith('ar-'))||
    null;
  arabicVoicesReady=voices.length>0;
}

if('speechSynthesis' in window){
  refreshArabicVoices();
  speechSynthesis.addEventListener('voiceschanged',refreshArabicVoices);
}

function getLearningVoice(locale){
  const voices=speechSynthesis.getVoices()||[];
  const wanted=String(locale).toLowerCase(),base=wanted.split('-')[0];
  if(base==='ar'){
    if(cachedArabicVoice)return cachedArabicVoice;
    refreshArabicVoices();
    return cachedArabicVoice||null;
  }
  return voices.find(v=>(v.lang||'').toLowerCase()===wanted)||
         voices.find(v=>(v.lang||'').toLowerCase().startsWith(base))||null;
}

function speak(text,forcedLang=null){
  stopAll();

  const value=String(text);
  const activeLang=forcedLang||lang;
  const locale=activeLang==='English'?'en-US':
               activeLang==='Français'?'fr-FR':activeLang==='Español'?'es-ES':activeLang==='Deutsch'?'de-DE':activeLang==='Italiano'?'it-IT':activeLang==='Português'?'pt-PT':'ar';

  const fallbackTTS=()=>{
    if(activeLang!=='العربية'){
      toast(ui==='Français'?'Speech indisponible':'Speech unavailable');
      return;
    }
    /* Fallback for Android/WebView devices that expose no Arabic voice.
       The text is encoded safely and played as normal audio. */
    try{
      const url='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&ttsspeed=0.72&q='+encodeURIComponent(value);
      audio.onerror=()=>{
        toast(ui==='العربية'?'النطق العربي غير متوفر فهاد الجهاز':'Speech unavailable');
      };
      audio.src=url;
      audio.volume=1;
      audio.play().catch(()=>{
        /* Silent failure: do not show the transient "Tap again" toast. */
      });
    }catch(e){
      toast(ui==='العربية'?'النطق غير متوفر فهاد الجهاز':'Speech unavailable');
    }
  };

  const speakNow=()=>{
    const voice=getLearningVoice(locale);
    if(activeLang==='العربية' && !voice){
      fallbackTTS();
      return;
    }
    if(!('speechSynthesis' in window)){
      fallbackTTS();
      return;
    }
    const u=new SpeechSynthesisUtterance(value);
    u.lang=locale;
    if(voice)u.voice=voice;
    u.rate=activeLang==='العربية'?.72:.82;
    u.pitch=1;
    u.volume=1;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  };

  if(!('speechSynthesis' in window)){
    fallbackTTS();
    return;
  }

  /* V36: speak immediately. Do not wait for voiceschanged or an 800ms timer.
     The browser can use its default voice even when getVoices() is still empty. */
  refreshArabicVoices();
  speakNow();
}

  }
}

<script>
/* V12.2 — touch/swipe navigation */
(function(){
  let sx=0,sy=0,swiping=false;

  function canGoNext(){
    if(stage==='learn') return true;
    if(stage==='listen') return locked;
    if(stage==='match') return locked;
    if(stage==='word') return locked;
    if(stage==='sentence') return true;
    if(stage==='build') return $('buildNext') && $('buildNext').style.display!=='none';
    if(stage==='review') return true;
    return false;
  }

  function goNextBySwipe(){
    if(stage==='learn'){nextStageSafe();return}
    if(stage==='listen' && locked){nextStageSafe();return}
    if(stage==='match' && locked){nextStageSafe();return}
    if(stage==='word' && locked){nextStageSafe();return}
    if(stage==='sentence'){startSentenceBuild();return}
    if(stage==='build' && $('buildNext') && $('buildNext').style.display!=='none'){buildNext();return}
    if(stage==='review'){reviewNext();return}
  }

  function goPreviousBySwipe(){
    previousStage();
  }

  document.addEventListener('touchstart',function(e){
    if(!e.touches || !e.touches.length)return;
    const t=e.touches[0];
    sx=t.clientX; sy=t.clientY; swiping=true;
  },{passive:true});

  document.addEventListener('touchend',function(e){
    if(!swiping || !e.changedTouches || !e.changedTouches.length)return;
    swiping=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-sx,dy=t.clientY-sy;

    /* Ignore taps, vertical scrolling and tiny movements. */
    if(Math.abs(dx)<65 || Math.abs(dx)<=Math.abs(dy)*1.25)return;

    const target=e.target;
    /* Don't hijack horizontal interaction inside form controls/choice buttons. */
    if(target && target.closest &&
       target.closest('button,input,select,textarea,a'))return;

    if(dx<0){
      if(canGoNext())goNextBySwipe();
      else toast(ui==='العربية'?'كمّل التمرين باش تدوز للمرحلة الموالية':
                 ui==='Français'?'Terminez l’exercice pour continuer':
                 'Finish the exercise to continue');
    }else{
      goPreviousBySwipe();
    }
  },{passive:true});
})();
</script>

<script>
/* V12.4 — reliable Suivant/Next navigation */
(function(){
  function nextStageSafe(){
    try{
      if(typeof learnNext==='function' && stage==='learn'){learnNext();return}
      if(typeof listenNext==='function' && stage==='listen' && locked){listenNext();return}
      if(typeof matchNext==='function' && stage==='match' && locked){matchNext();return}
      if(typeof wordNext==='function' && stage==='word' && locked){wordNext();return}
      if(typeof sentenceNext==='function' && stage==='sentence'){sentenceNext();return}
      if(typeof buildNext==='function' && stage==='build' &&
         $('buildNext') && $('buildNext').style.display!=='none'){buildNext();return}
      if(typeof reviewNext==='function' && stage==='review'){reviewNext();return}
      if(typeof nextStage==='function'){nextStage();return}
      if(typeof advance==='function'){advance();return}
    }catch(e){
      console.error('Next navigation error:',e);
    }
  }

  window.nextStageSafe=nextStageSafe;

  document.addEventListener('click',function(e){
    const b=e.target.closest && e.target.closest(
      '#learnNext,#listenNext,#matchNext,#wordNext,#sentenceNext,#buildNext,#reviewNext'
    );
    if(!b)return;

    /* Existing inline onclick handlers take priority. If the button has no
       inline handler and remains on screen, provide the safe fallback. */
    const inline=b.getAttribute('onclick');
    if(!inline){
      e.preventDefault();
      nextStageSafe();
    }
  },true);
})();
</script>

<script>
/* V12.5 — direct Suivant navigation */
(function(){
  window.awNext=function(){
    try{
      if(typeof stage==='undefined') return;
      if(stage==='learn'){
        if(typeof learnNext==='function'){learnNext();return;}
        if(typeof nextLearn==='function'){nextLearn();return;}
      }
      if(stage==='listen'){
        if(typeof locked!=='undefined' && !locked)return;
        if(typeof listenNext==='function'){listenNext();return;}
      }
      if(stage==='match'){
        if(typeof locked!=='undefined' && !locked)return;
        if(typeof matchNext==='function'){matchNext();return;}
      }
      if(stage==='word'){
        if(typeof locked!=='undefined' && !locked)return;
        if(typeof wordNext==='function'){wordNext();return;}
      }
      if(stage==='sentence'){
        if(typeof sentenceNext==='function'){sentenceNext();return;}
        if(typeof startSentenceBuild==='function'){startSentenceBuild();return;}
      }
      if(stage==='build'){
        const b=document.getElementById('buildNext');
        if(b && b.style.display==='none')return;
        if(typeof buildNext==='function'){buildNext();return;}
      }
      if(stage==='review'){
        if(typeof reviewNext==='function'){reviewNext();return;}
      }
    }catch(err){console.error('Animal World Next:',err);}
  };

  function bind(id){
    const b=document.getElementById(id);
    if(!b)return;
    const oc=b.getAttribute('onclick');
    if(!oc)b.addEventListener('click',function(e){e.preventDefault();window.awNext();},false);
  }
  ['learnNext','listenNext','matchNext','wordNext','sentenceNext','buildNext','reviewNext'].forEach(bind);
})();
</script>

<script>
/* V13.8 — FINAL Settings fix
   The Settings screen uses .settingsIconCard elements, so older handlers
   that expected appLangChoices/learnLangChoices could not update the visible UI.
   This patch makes the three Settings controls work directly with the actual DOM.
*/
(function(){
  const APP_LANGS = ['العربية','Français','English','Español','Deutsch'];
  const LEARN_LANGS = ['العربية','Français','English','Español','Deutsch'];
  const LEVELS2 = ['Starter','A1','A2','B1','B2','C1','C2'];

  const labels = {
    العربية:'🇲🇦 العربية', Français:'🇫🇷 Français', English:'🇬🇧 English',
    Português:'🇵🇹 Português', Español:'🇪🇸 Español', Italiano:'🇮🇹 Italiano',
    Deutsch:'🇩🇪 Deutsch'
  };

  function settingsCards(){
    return document.querySelectorAll('#settings .settingsIconCard');
  }

  function settingText(key){
    if(ui==='Français'){
      return key==='app' ? "Langue de l’application" :
             key==='learn' ? "Langue d’apprentissage" : "Niveau";
    }
    if(ui==='English'){
      return key==='app' ? "App language" :
             key==='learn' ? "Learning language" : "Level";
    }
    return key==='app' ? "لغة التطبيق" :
           key==='learn' ? "لغة التعلم" : "المستوى";
  }

  function refreshSettingsCards(){
    const cards = settingsCards();
    if(!cards.length) return;
    const titleKeys=['app','learn','level'];
    const values=[ui,lang,level];

    cards.forEach((card,i)=>{
      const b=card.querySelector('b');
      const small=card.querySelector('small');
      if(b) b.textContent=settingText(titleKeys[i]);
      if(small) small.textContent=values[i];
    });
  }

  function panel(){ return document.getElementById('settingsOptionPanel'); }
  function clearPanel(){ const p=panel(); if(p)p.innerHTML=''; }

  function panelTitle(kind){
    if(ui==='Français')
      return kind==='app' ? "Langue de l’application" :
             kind==='learn' ? "Langue d’apprentissage" : "Niveau";
    if(ui==='English')
      return kind==='app' ? "App language" :
             kind==='learn' ? "Learning language" : "Level";
    return kind==='app' ? "لغة التطبيق" :
           kind==='learn' ? "لغة التعلم" : "المستوى";
  }

  function renderChoices(kind){
    const p=panel();
    if(!p) return;

    const values = kind==='app' ? APP_LANGS :
                   kind==='learn' ? LEARN_LANGS : LEVELS2;
    const current = kind==='app' ? ui : kind==='learn' ? lang : level;

    p.innerHTML =
      '<div class="awOptionTitle">'+panelTitle(kind)+'</div>'+
      '<div class="'+(kind==='level'?'awLevelGrid':'awOptionGrid')+'">'+
      values.map(v=>{
        const text = kind==='level' ? v : labels[v];
        const active = v===current ? ' active' : '';
        const safe = String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        return '<button type="button" class="awOptionBtn'+active+'" data-value="'+safe+'">'+
               text+(v===current?' ✓':'')+'</button>';
      }).join('')+
      '</div>';

    p.querySelectorAll('.awOptionBtn').forEach(btn=>{
      btn.addEventListener('click',function(e){
        e.preventDefault();
        const v=this.dataset.value;

        if(kind==='app'){
          ui=v;
          save();
          applyDir();
          refreshSettingsCards();
          renderHome();
          if(typeof renderHomeVariant==='function') renderHomeVariant();
          if(typeof applyNavLabels==='function') applyNavLabels();
          renderChoices('app');
          setTimeout(clearPanel,0);
        }else if(kind==='learn'){
          lang=v;
          save();
          refreshSettingsCards();
          renderHome();
          if(typeof renderHomeVariant==='function') renderHomeVariant();
          renderChoices('learn');
          setTimeout(clearPanel,0);
        }else{
          level=v;
          save();
          refreshSettingsCards();
          renderHome();
          if(typeof renderHomeVariant==='function') renderHomeVariant();
          renderChoices('level');
          setTimeout(clearPanel,0);
        }
      });
    });
  }

  window.openSetting = function(kind){
    const map={appLanguage:'app',learningLanguage:'learn',level:'level'};
    const k=map[kind];
    if(!k) return;
    refreshSettingsCards();
    renderChoices(k);
  };

  window.refreshSettingsIconValues = refreshSettingsCards;

  const oldRenderSettings = window.renderSettings;
  window.renderSettings = function(){
    refreshSettingsCards();
    if(oldRenderSettings && oldRenderSettings!==window.renderSettings){
      try{ oldRenderSettings(); }catch(e){}
    }
    refreshSettingsCards();
  };

  document.addEventListener('DOMContentLoaded',function(){
    applyDir();
    refreshSettingsCards();
  });
})();
</script>

<script>
/* V14.0 — Smart Review FIX
   Keep mistakes made during the lesson available for the Review stage,
   even if the learner later gets the same question right in the lesson.
*/
(function(){
  let lessonMistakes = [];

  const oldStartLesson = window.startLesson;
  window.startLesson = function(){
    lessonMistakes = [];
    return oldStartLesson ? oldStartLesson() : undefined;
  };

  const oldAnswer = window.answer;
  window.answer = function(id, ok){
    if(!ok && id && !lessonMistakes.includes(id)) lessonMistakes.push(id);
    return oldAnswer ? oldAnswer(id, ok) : undefined;
  };

  let reviewQueue = [];
  let reviewPos = 0;
  let reviewLocked = false;

  window.renderReview = function(){
    const stored = Array.isArray(mistakes) ? mistakes : [];
    const ids = [...new Set([...lessonMistakes, ...stored])];
    reviewQueue = ids.map(id=>A.find(a=>a.id===id)).filter(Boolean);
    reviewPos = 0;
    reviewLocked = false;

    const title=$('reviewTitle');
    const sub=$('reviewSub');
    const list=$('reviewList');
    const next=$('reviewNext');

    if(title) title.textContent=t('review');
    if(sub) sub.textContent = ui==='العربية'
      ? 'هاد الكلمات وقع فيها خطأ وخصنا نراجعوها دابا.'
      : ui==='Français'
        ? 'Ces mots ont posé problème et doivent être révisés maintenant.'
        : 'These words were missed and need review now.';

    if(!reviewQueue.length){
      if(list) list.innerHTML='<span class="badge">'+t('reviewNone')+'</span>';
      if(next){next.style.display='block';next.textContent=t('reviewDone');}
      return;
    }

    renderReviewQuestion();
  };

  function renderReviewQuestion(){
    const a=reviewQueue[reviewPos];
    if(!a)return;

    currentId=a.id;
    reviewLocked=false;

    const list=$('reviewList');
    const next=$('reviewNext');

    if(list){
      const choices=shuffle([a,...A.filter(x=>x.id!==a.id).sort(()=>Math.random()-.5).slice(0,2)]);
      list.innerHTML=
        '<div class="reviewCard">'+
          '<div class="small">'+(reviewPos+1)+' / '+reviewQueue.length+'</div>'+
          '<div class="miniAnimal">'+animalVisual(a)+'</div>'+
          '<div class="word">'+word(a)+'</div>'+
          '<p class="small">'+
            (ui==='العربية'?'شنو هي الصورة الصحيحة؟':
             ui==='Français'?'Quelle est la bonne image ?':
             'Choose the correct animal.')+
          '</p>'+
          '<div class="choices" id="reviewChoices">'+
            choices.map(x=>'<button class="choice" onclick="reviewAnswer(\''+x.id+'\')">'+animalVisual(x)+'</button>').join('')+
          '</div>'+
          '<div id="reviewFeedback" class="feedback"></div>'+
        '</div>';
    }
    if(next) next.style.display='none';
  }

  window.reviewAnswer=function(id){
    if(reviewLocked)return;
    const a=A.find(x=>x.id===currentId);
    if(!a)return;

    const ok=id===a.id;
    reviewLocked=true;

    const fb=$('reviewFeedback');
    const choices=$('reviewChoices');

    if(ok){
      answer(a.id,true);
      addXP(10);
      if(fb){
        fb.textContent=t('correct');
        fb.className='feedback ok';
      }
      if(choices)choices.querySelectorAll('button').forEach(b=>b.disabled=true);

      const next=$('reviewNext');
      if(next){
        next.style.display='block';
        next.textContent=reviewPos<reviewQueue.length-1 ? t('next') : t('reviewDone');
      }
    }else{
      reviewLocked=false;
      if(fb){
        fb.textContent=t('try');
        fb.className='feedback bad';
      }
      answer(a.id,false);
    }
  };

  window.reviewNext=function(){
    if(reviewQueue.length && reviewPos<reviewQueue.length-1){
      reviewPos++;
      renderReviewQuestion();
    }else{
      stage='complete';
      completeLevel();
    }
  };

  // Replace the original end-of-lesson transition so Review is always entered.
  window.buildNext = function(){
    if(pos<questionTotal()-1){
      pos++;
      stage='sentence';
      go('sentenceIntro');
    }else{
      stage='review';
      go('review');
    }
  };

  // Also make review accessible after the page loads.
  const oldLoad = window.renderHome;
  document.addEventListener('DOMContentLoaded',function(){
    lessonMistakes=[];
  });
})();
</script>

<script id="V14_16_GLOBAL_SMART_ENGINE">
(function(){
  'use strict';

  function fitOneText(text, card){
    if(!text || !card) return;

    var rtl = document.documentElement.dir === 'rtl';
    var isMatch = !!card.closest('#matchChoices');
    var max = isMatch ? (rtl ? 29 : 24) : (rtl ? 30 : 23);
    var min = rtl ? 17 : 14;

    text.style.fontSize = max + 'px';
    text.style.whiteSpace = 'nowrap';

    var available = Math.max(18, card.clientWidth - 10);
    var guard = 80;

    while(text.scrollWidth > available && max > min && guard--){
      max -= 1;
      text.style.fontSize = max + 'px';
    }
  }

  function fitCard(card){
    if(!card || !card.isConnected) return;

    var text = card.querySelector(
      '.animalChoiceName,.label,.awSmartText,[data-card-text]'
    );
    var icon = card.querySelector(
      '.animalChoiceIcon,.awSmartIcon,img,[data-card-icon]'
    );

    /* Text gets priority. The icon yields space when both coexist. */
    if(icon && text){
      icon.style.flex = '0 1 auto';
      icon.style.maxWidth = '100%';
      icon.style.fontSize = '34px';
    }

    fitOneText(text, card);

    /* Second pass after the text size is known. */
    if(icon && text){
      var longText = text.scrollWidth > card.clientWidth * 0.88;
      icon.style.fontSize = longText ? '30px' : '36px';
      requestAnimationFrame(function(){ fitOneText(text, card); });
    }
  }

  function fitAll(){
    var selectors = [
      '#listenChoices .choice',
      '#matchChoices button',
      '.awSmartCard',
      '[data-smart-card]'
    ];

    var seen = new Set();
    document.querySelectorAll(selectors.join(',')).forEach(function(card){
      if(!seen.has(card)){
        seen.add(card);
        fitCard(card);
      }
    });
  }

  /*
    IMPORTANT: run after EVERY content replacement, not only on first load.
    This catches swipe/next/previous/question rendering without requiring
    every future stage to remember to call the engine manually.
  */
  var observer = new MutationObserver(function(mutations){
    var relevant = false;
    for(var i=0;i<mutations.length;i++){
      if(mutations[i].type === 'childList' || mutations[i].type === 'characterData'){
        relevant = true;
        break;
      }
    }
    if(relevant){
      requestAnimationFrame(fitAll);
      setTimeout(fitAll, 60);
    }
  });

  function start(){
    fitAll();
    setTimeout(fitAll,100);
    observer.observe(document.body,{subtree:true,childList:true,characterData:true});
  }

  window.addEventListener('resize',fitAll);
  window.addEventListener('orientationchange',fitAll);

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded',start,{once:true});
  }else{
    start();
  }

  window.AnimalWorldSmartCards = {
    refresh: fitAll,
    fitCard: fitCard
  };
})();
</script>

<script id="V14_17_LISTEN_RENDER_ENGINE">
(function(){
  'use strict';

  function fitListenCard(card){
    var text=card.querySelector('.animalChoiceName,.label');
    var icon=card.querySelector('.animalChoiceIcon');
    if(!text) return;

    var rtl=document.documentElement.dir==='rtl';
    var size=rtl?30:23;
    var min=rtl?17:14;
    var available=Math.max(18,card.clientWidth-8);

    if(icon){
      icon.style.fontSize='34px';
      icon.style.flex='0 1 auto';
    }

    text.style.fontSize=size+'px';
    text.style.whiteSpace='nowrap';

    var guard=60;
    while(text.scrollWidth>available && size>min && guard--){
      size--;
      text.style.fontSize=size+'px';
    }
  }

  function fitListenNow(){
    document.querySelectorAll('#listenChoices .choice').forEach(fitListenCard);
  }

  /* Expose a stable hook for the app's question renderer. */
  window.refreshListenCards = fitListenNow;

  /*
    MutationObserver alone can run after the browser paints an intermediate
    state. Use repeated animation-frame passes whenever Listen content changes.
    This makes the NEW question fit before the learner can meaningfully answer.
  */
  var pending=false;
  function scheduleListenFit(){
    if(pending) return;
    pending=true;

    requestAnimationFrame(function(){
      pending=false;
      fitListenNow();

      requestAnimationFrame(function(){
        fitListenNow();
      });

      setTimeout(fitListenNow,50);
    });
  }

  var observer=new MutationObserver(function(mutations){
    for(var i=0;i<mutations.length;i++){
      var target=mutations[i].target;
      if((target && target.closest && target.closest('#listenChoices')) ||
         (target && target.id==='listenChoices')){
        scheduleListenFit();
        return;
      }
    }
  });

  function start(){
    scheduleListenFit();
    observer.observe(document.body,{
      subtree:true,
      childList:true,
      characterData:true
    });
  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',start,{once:true});
  }else{
    start();
  }

  window.addEventListener('resize',scheduleListenFit);
  window.addEventListener('orientationchange',scheduleListenFit);

  /*
    Also hook common navigation/render entry points when they exist.
    We deliberately call the original first, then fit the freshly rendered
    question.
  */
  ['go','nextQuestion','renderListen','showListenQuestion','loadListenQuestion']
    .forEach(function(name){
      var fn=window[name];
      if(typeof fn==='function' && !fn.__awV1417Wrapped){
        function wrapped(){
          var result=fn.apply(this,arguments);
          scheduleListenFit();
          return result;
        }
        wrapped.__awV1417Wrapped=true;
        window[name]=wrapped;
      }
    });
})();
</script>

    var size=rtl?30:23;

      icon.style.lineHeight='1';
    }

    text.style.fontSize=size+'px';
    text.style.fontWeight='900';
    text.style.whiteSpace='nowrap';
    text.style.overflow='hidden';

    var guard=80;
    while(text.scrollWidth>available && size>min && guard--){
      size--;
      text.style.fontSize=size+'px';
    }
  }

  function fitAll(){
    queued=false;
    document.querySelectorAll('#listenChoices .choice').forEach(fitCard);
  }

  function fitBeforePaint(){
    fitAll();
    requestAnimationFrame(fitAll);
  }

    The key fix: detect the actual replacement/creation of Listen cards and
    fit them immediately. Multiple passes cover render -> layout -> paint,
    so the learner never has to touch a card to trigger the correct sizing.
  */
  function schedule(){
    if(queued) return;
    queued=true;
    fitAll();
    requestAnimationFrame(function(){
      fitAll();

    });

    setTimeout(fitAll,30);

          (n.id==='listenChoices' ||
           (n.closest && n.closest('#listenChoices')))){
          hit=true; break;
        }
      }
      if(hit) break;
    }
    if(hit) schedule();
  });

  function start(){
    schedule();
    observer.observe(document.body,{
      subtree:true,
      childList:true,
      characterData:true
    });
  }

  /* Also refresh immediately after common navigation functions. */
  ['go','nextQuestion','renderListen','showListenQuestion','loadListenQuestion']
    .forEach(function(name){

  window.addEventListener('orientationchange',schedule);

<script id="V14_19_STABLE_CARD_ENGINE">
(function(){
  'use strict';

  function fit(el, card, max, min){
    if(!el || !card) return;
    var available=Math.max(18, card.clientWidth-10);
    var s=max;
    el.style.fontSize=s+'px';
    el.style.whiteSpace='nowrap';
    var guard=80;
    while(el.scrollWidth>available && s>min && guard--){
      s--;
      el.style.fontSize=s+'px';
    }

  function refresh(){
    var rtl=document.documentElement.dir==='rtl';

      card.style.minHeight='82px';
      card.style.maxHeight='82px';
      if(text) fit(text,card,rtl?28:23,rtl?18:15);
    });
  }

  window.refreshListenCards=refresh;
  window.refreshSmartCards=refresh;

  /* Re-run after render, after layout, and after navigation. */
  function multi(){
    refresh();
    requestAnimationFrame(refresh);
    requestAnimationFrame(function(){requestAnimationFrame(refresh);});
    setTimeout(refresh,50);
    setTimeout(refresh,150);

  var observer=new MutationObserver(function(ms){
    for(var i=0;i<ms.length;i++){
      var t=ms[i].target;

  }

  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',start,{once:true});
  }else start();

})();

(function(){

    return el && el.closest && el.closest(ROOT_SELECTOR) &&
           !el.closest('#sentenceBuild');
  }

  function textOf(el){
    var direct='';
    for(var i=0;i<el.childNodes.length;i++){
      if(el.childNodes[i].nodeType===3) direct+=el.childNodes[i].nodeValue;
    }
    return (direct || el.textContent || '').trim();

  function naturalWidth(el){
    var cs=getComputedStyle(el);
    var probe=document.createElement('span');
    probe.textContent=textOf(el);

      'position:absolute;visibility:hidden;white-space:nowrap;'+
      'font-family:'+cs.fontFamily+';font-size:'+cs.fontSize+
      ';font-weight:'+cs.fontWeight+';letter-spacing:'+cs.letterSpacing+

    var isCard=(tag==='BUTTON' ||
      /(^|[\s_-])(choice|option|answer|card|wordcard|word-card)([\s_-]|$)/.test(cls));
    if(!isCard)return;
    if(el.children.length>3)return;

    var parent=el.parentElement;
    if(!parent)return;

    if(parentWidth<120)return;

    var cs=getComputedStyle(el);
    var padding=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
    var natural=Math.ceil(naturalWidth(el)+padding+16);

      ROOT_SELECTOR+' .wordCard,'+

  var used=data.reduce(function(s,x){return s+x.width},0);
  for(var i=0;i<Math.max(0,total-used);i++)data[i%3].width++;

  data.forEach(function(x){
    var card=x.card,label=x.label,w=x.width;
    card.style.setProperty('width',w+'px','important');
    card.style.setProperty('min-width',w+'px','important');
    card.style.setProperty('max-width',w+'px','important');

    if(!label)return;

    /* Same standard as Listen & Choose. */
    label.style.setProperty('font-size','18px','important');
    label.style.setProperty('font-weight','900','important');

    var size=18;
    var available=Math.max(18,w-x.pad-14);

    /* Only the long word shrinks, and only when its card has reached the
       practical maximum available width. */
    if(label.scrollWidth>available && w>=Math.floor(total*.45)){
      var floor=12,guard=100;
      while(label.scrollWidth>available && size>floor && guard--){
        size--;
        label.style.setProperty('font-size',size+'px','important');
      }
    }
  });
}

var timer=0;
function schedule(){
  clearTimeout(timer);
  refresh();
  requestAnimationFrame(refresh);
  timer=setTimeout(refresh,100);
}

window.refreshMatchWordPictureReal=schedule;

var observer=new MutationObserver(function(ms){
  for(var i=0;i<ms.length;i++){
    var t=ms[i].target;
    if(t&&t.closest&&t.closest('#matchChoices')){
      schedule();return;
    }
  }
});

function start(){
  schedule();
  var root=document.getElementById('matchChoices')||document.body;
  observer.observe(root,{subtree:true,childList:true,characterData:true});
}
if(document.readyState==='loading')
  document.addEventListener('DOMContentLoaded',start,{once:true});
else start();

window.addEventListener('resize',schedule);
window.addEventListener('orientationchange',schedule);
})();
</script>


<script id="V14_61_EXACT_EXERCISE_REVIEW">
/*
 V14.61 — Exact Exercise Review ONLY.
 The existing learning stages are untouched. Review now remembers the
 exercise type in which an item was missed and recreates that same exercise.
*/
(function(){
  'use strict';

  var exactReviewMistakes=[];
  var exactReviewQueue=[];
  var exactReviewPos=0;
  var exactReviewLocked=false;
  var exactReviewType='';

  function remember(id,type){
    if(!id)return;
    var found=exactReviewMistakes.some(function(x){return x.id===id&&x.type===type});
    if(!found)exactReviewMistakes.push({id:id,type:type});
  }

  var baseStartLesson=window.startLesson;
  window.startLesson=function(){
    exactReviewMistakes=[];
    exactReviewQueue=[];
    exactReviewPos=0;
    return baseStartLesson?baseStartLesson.apply(this,arguments):undefined;
  };

  /* Capture the stage at the moment the learner answers incorrectly. */
  var baseAnswer=window.answer;
  window.answer=function(id,ok){
    if(!ok && id){
      var type =
        stage==='listen' ? 'listen' :
        stage==='match' ? 'match' :
        stage==='word' ? 'word' :
        stage==='build' ? 'build' : null;
      if(type)remember(id,type);
    }
    return baseAnswer?baseAnswer.apply(this,arguments):undefined;
  };

  /* Build Sentence does not call answer(), so capture its failed completion. */
  var baseAddToken=window.addToken;
  window.addToken=function(btn,x){
    var before=window.built ? window.built.length : 0;
    var result=baseAddToken?baseAddToken.apply(this,arguments):undefined;
    try{
      if(stage==='build' && typeof built!=='undefined'){
        var a=current();
        var target=sentence(a).replace(/[.,!?]/g,'').split(/\s+/).join(' ');
        var cur=built.map(function(v){return v.text}).join(' ');
        if(built.length===target.split(' ').length && cur!==target){
          remember(a.id,'build');
        }
      }
    }catch(e){}
    return result;
  };

  function findAnimal(id){return A.find(function(x){return x.id===id})}

  function reviewChoices(correct){
    return shuffle([correct].concat(
      A.filter(function(x){return x.id!==correct.id}).sort(function(){return Math.random()-.5}).slice(0,2)
    ));
  }

  function renderExactReview(){
    exactReviewQueue=exactReviewMistakes.slice();
    /* Also include persistent mistakes, defaulting to the original exercise
       type only when no exact type is known. */
    (Array.isArray(mistakes)?mistakes:[]).forEach(function(id){
      if(!exactReviewQueue.some(function(x){return x.id===id})){
        exactReviewQueue.push({id:id,type:'listen'});
      }
    });
    exactReviewPos=0;
    exactReviewLocked=false;

    var title=$('reviewTitle'),sub=$('reviewSub'),next=$('reviewNext');
    if(title)title.textContent=t('review');
    if(sub)sub.textContent=ui==='العربية'
      ? 'غادي نعاودو نفس التمرين اللي وقع فيه الخطأ.'
      : ui==='Français'
        ? 'Nous refaisons exactement l’exercice qui a posé problème.'
        : 'We repeat the exact exercise you missed.';

    if(!exactReviewQueue.length){
      $('reviewList').innerHTML='<span class="badge">'+t('reviewNone')+'</span>';
      if(next){next.style.display='block';next.textContent=t('reviewDone')}
      return;
    }
    renderExactQuestion();
  }

  function renderExactQuestion(){
    var item=exactReviewQueue[exactReviewPos];
    var a=findAnimal(item.id);
    if(!a)return;
    exactReviewLocked=false;
    exactReviewType=item.type;
    currentId=a.id;

    var list=$('reviewList'),next=$('reviewNext');
    if(next)next.style.display='none';

    if(item.type==='listen'){
      list.innerHTML=
        '<div class="reviewCard">'+
        '<div class="small">'+(exactReviewPos+1)+' / '+exactReviewQueue.length+'</div>'+
        '<button id="reviewListenAudioBtn" type="button" aria-label="Replay audio" onclick="speakCurrentWord()">🔊</button>'+
        '<p class="small">'+
        (ui==='العربية'?'شنو هو اسم الحيوان اللي سمعتي؟':
         ui==='Français'?'Quel nom d’animal as-tu entendu ?':'Which animal name did you hear?')+
        '</p>'+
        '<div class="choices" id="reviewChoices">'+
        reviewChoices(a).map(function(x){
          return '<button class="choice" onclick="exactReviewAnswer(\''+x.id+'\')">'+
            '<span class="animalChoiceIcon">'+animalVisual(x)+'</span>'+
            '<span class="animalChoiceName">'+word(x)+'</span></button>';
        }).join('')+
        '</div><div id="reviewFeedback" class="feedback"></div></div>';
      setTimeout(function(){
        var audioBtn=document.getElementById('reviewListenAudioBtn');
        if(audioBtn){
          audioBtn.onclick=function(e){e.preventDefault();speakCurrentWord();};
        }
        speakCurrentWord();
      },180);
      return;
    }

    if(item.type==='match'){
      list.innerHTML=
        '<div class="reviewCard">'+
        '<div class="small">'+(exactReviewPos+1)+' / '+exactReviewQueue.length+'</div>'+
        '<div class="miniAnimal">'+animalVisual(a)+'</div>'+
        '<p class="small">'+
        (ui==='العربية'?'طابق الكلمة مع الصورة:':
         ui==='Français'?'Associe le mot à l’image :':'Match the word to the picture:')+
        '</p>'+
        '<div class="choices" id="reviewChoices">'+
        reviewChoices(a).map(function(x){
          return '<button class="choice" onclick="exactReviewAnswer(\''+x.id+'\')"><span class="animalChoiceName">'+word(x)+'</span></button>';
        }).join('')+
        '</div><div id="reviewFeedback" class="feedback"></div></div>';
      return;
    }

    if(item.type==='word'){
      var w=word(a),chars=Array.from(w),valid=chars.map(function(c,j){return {c:c,j:j}})
        .filter(function(x){return /[\p{L}]/u.test(x.c)});
      var pick=valid[Math.floor(Math.random()*valid.length)]||{c:chars[0],j:0};
      var missingLetter=pick.c;
      var others=Array.from(new Set(chars.filter(function(c){return c!==missingLetter})));
      var pool=lang==='العربية'?['ا','ب','ت','ر','س','م','ن','ل']:Array.from('ABCDEFGHIJKLMNOPQRSTUVWXYZ');
      while(others.length<2){
        var q=pool.find(function(c){return c.toLowerCase()!==missingLetter.toLowerCase()&&!others.includes(c)});
        if(!q)break;others.push(q);
      }
      window._exactReviewMissing=missingLetter;
      list.innerHTML=
        '<div class="reviewCard">'+
        '<div class="small">'+(exactReviewPos+1)+' / '+exactReviewQueue.length+'</div>'+
        '<div class="miniAnimal">'+animalVisual(a)+'</div>'+
        '<div id="reviewWordDisplay" class="wordDisplay '+(lang==='العربية'?'rtl':'ltr')+'" dir="'+(lang==='العربية'?'rtl':'ltr')+'">'+
        chars.map(function(c,j){return j===pick.j?'<span class="letterBox missing">?</span>':'<span class="letterBox">'+c+'</span>'}).join('')+
        '</div>'+
        '<p class="small">'+t('wordPrompt')+'</p>'+
        '<div class="choices" id="reviewChoices">'+
        shuffle([missingLetter].concat(others.slice(0,2))).map(function(x){
          return '<button class="letterChoice" onclick="exactReviewAnswer(\''+escapeAttr(x)+'\')">'+x+'</button>';
        }).join('')+
        '</div><div id="reviewFeedback" class="feedback"></div></div>';
      return;
    }

    /* build */
    var tokens=sentence(a).replace(/[.,!?]/g,'').split(/\s+/);
    window._exactBuild=[];
    list.innerHTML=
      '<div class="reviewCard">'+
      '<div class="small">'+(exactReviewPos+1)+' / '+exactReviewQueue.length+'</div>'+
      '<div class="word" id="reviewBuildTarget" dir="'+(lang==='العربية'?'rtl':'ltr')+'">'+sentence(a)+'</div>'+
      '<div id="reviewBuiltSentence" class="builtSentence" dir="'+(lang==='العربية'?'rtl':'ltr')+'"></div>'+
      '<div class="choices" id="reviewBuildBank">'+
      shuffle(tokens).map(function(x,i){
        return '<button class="reviewBuildToken" data-i="'+i+'" onclick="exactReviewBuildToken(this)">'+x+'</button>';
      }).join('')+
      '</div><div id="reviewFeedback" class="feedback"></div></div>';
  }

  function finishCorrect(){
    var item=exactReviewQueue[exactReviewPos];
    var fb=$('reviewFeedback');
    if(fb){fb.textContent=t('correct');fb.className='feedback ok'}

    /*
      Revision-only behavior:
      once this exact mistake is answered correctly, immediately load the
      next recorded mistake. We deliberately do NOT use the normal lesson
      answer/navigation engine and do NOT depend on a Review Next button.
    */
    /* Revision timing: Listen & Choose and Match must advance immediately.
       Keep the existing short feedback pause for Word and Build, which already
       behave correctly. */
    var delay=0;
    setTimeout(function(){
      if(exactReviewPos<exactReviewQueue.length-1){
        exactReviewPos++;
        exactReviewLocked=false;
        renderExactQuestion();
      }else{
        stage='complete';
        completeLevel();
      }
    },delay);
  }

  window.exactReviewAnswer=function(id){
    if(exactReviewLocked)return;
    var item=exactReviewQueue[exactReviewPos],a=findAnimal(item.id);
    if(!a)return;
    var ok=false;

    if(exactReviewType==='word'){
      ok=String(id).toLowerCase()===String(window._exactReviewMissing).toLowerCase();
    }else{
      ok=id===a.id;
    }

    var fb=$('reviewFeedback');
    if(!ok){
      if(fb){fb.textContent=t('try');fb.className='feedback bad'}
      answer(a.id,false);
      return;
    }

    exactReviewLocked=true;
    if(exactReviewType==='word'){
      var disp=$('reviewWordDisplay');
      if(disp){
        var box=disp.querySelector('.missing');
        if(box)box.textContent=id;
      }
    }
    var choices=$('reviewChoices');
    if(choices)choices.querySelectorAll('button').forEach(function(b){b.disabled=true});
    addXP(10);
    finishCorrect();
  };

  window.exactReviewBuildToken=function(btn){
    if(exactReviewLocked || btn.disabled)return;
    var item=exactReviewQueue[exactReviewPos],a=findAnimal(item.id);
    if(!a)return;

    btn.disabled=true;
    window._exactBuild.push({text:btn.textContent,btn:btn});
    var box=$('reviewBuiltSentence');
    box.innerHTML='';
    window._exactBuild.forEach(function(v){
      var b=document.createElement('button');
      b.className='builtToken';
      b.textContent=v.text;
      box.appendChild(b);
    });

    var target=sentence(a).replace(/[.,!?]/g,'').split(/\s+/).join(' ');
    var cur=window._exactBuild.map(function(v){return v.text}).join(' ');

    if(window._exactBuild.length===target.split(' ').length){
      if(cur===target){
        exactReviewLocked=true;
        document.querySelectorAll('#reviewBuildBank button').forEach(function(b){b.disabled=true});
        addXP(15);
        finishCorrect();
      }else{
        var fb=$('reviewFeedback');
        if(fb){fb.textContent=t('try');fb.className='feedback bad'}
        /* Reset this review attempt without leaving the review question. */
        setTimeout(function(){
          window._exactBuild=[];
          document.querySelectorAll('#reviewBuildBank button').forEach(function(b){b.disabled=false});
          if(fb)fb.textContent='';
          box.innerHTML='';
        },350);
      }
    }
  };

  var baseReviewNext=window.reviewNext;
  window.reviewNext=function(){
    if(exactReviewQueue.length && exactReviewPos<exactReviewQueue.length-1){
      exactReviewPos++;
      renderExactQuestion();
      return;
    }
    stage='complete';
    completeLevel();
  };

  window.renderReview=renderExactReview;
})();
</script>

<script id="V14_82_REVISION_SMART_CARDS_BALANCED_ENGINE">
(function(){
'use strict';

function measure(label,size){
  var c=getComputedStyle(label),p=document.createElement('span');
  p.textContent=(label.textContent||'').trim();
  p.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;'+
    'font-family:'+c.fontFamily+';font-size:'+size+'px;font-weight:'+c.fontWeight+
    ';letter-spacing:'+c.letterSpacing+';line-height:1.15';
  document.body.appendChild(p);
  var w=p.getBoundingClientRect().width;
  p.remove();
  return w;
}

function isMatchReview(root){
  /* Match review has the animal picture/icon in the review question. */
  return !!document.querySelector('#reviewList .miniAnimal');
}

function apply(){
  var root=document.getElementById('reviewChoices');
  if(!root)return;
  var cards=Array.from(root.querySelectorAll('.choice'));
  if(cards.length!==3)return;

  var gap=7, total=root.clientWidth-gap*2;
  if(total<180)return;

  var min=54, data=cards.map(function(card){
    var label=card.querySelector('.animalChoiceName');
    var cs=getComputedStyle(card);
    var pad=(parseFloat(cs.paddingLeft)||0)+(parseFloat(cs.paddingRight)||0);
    return {
      card:card,label:label,pad:pad,
      natural:label?Math.max(min,Math.ceil(measure(label,18)+pad+12)):min
    };
  });

  /* Smart allocation: shorter words use less, longer words use more. */
  var extra=Math.max(0,total-min*3);
  var demand=data.reduce(function(s,x){
    return s+Math.max(0,x.natural-min);
  },0);

  data.forEach(function(x){
    x.w=Math.floor(min+(demand?
      extra*Math.max(0,x.natural-min)/demand:extra/3));
  });

  var used=data.reduce(function(s,x){return s+x.w},0);
  for(var i=0;i<Math.max(0,total-used);i++)data[i%3].w++;

  data.forEach(function(x){
    var card=x.card,label=x.label,w=x.w;
    card.style.setProperty('width',w+'px','important');
    card.style.setProperty('min-width',w+'px','important');
    card.style.setProperty('max-width',w+'px','important');

    if(!label)return;

    /* Readable standard, matching the successful normal-stage typography. */
    var size=18;
    label.style.setProperty('font-size','18px','important');
    label.style.setProperty('font-weight','900','important');

    var available=Math.max(18,w-x.pad-10);

    /* Only the long word shrinks after its card has received its maximum
       possible share. Short/medium words remain readable at 18px. */
    if(measure(label,size)>available){
      var floor=12;
      while(measure(label,size)>available && size>floor){
        size--;
        label.style.setProperty('font-size',size+'px','important');
      }
    }
  });
}

var timer=0;
function schedule(){
  clearTimeout(timer);
  apply();
  requestAnimationFrame(apply);
  timer=setTimeout(apply,90);
}

function start(){
  schedule();
  var observer=new MutationObserver(function(ms){
    for(var i=0;i<ms.length;i++){
      var t=ms[i].target;
      if(t&&t.closest&&t.closest('#reviewList')){
        schedule();return;
      }
    }
  });
  observer.observe(document.body,{subtree:true,childList:true,characterData:true});
  window.addEventListener('resize',schedule);
  window.addEventListener('orientationchange',schedule);
}
if(document.readyState==='loading')
  document.addEventListener('DOMContentLoaded',start,{once:true});
else start();
})();
</script>

<script id="AW_V15_ARCHITECTURE_CORE">
/*
  Animal World V15 — Architecture Core Foundation
  NON-DESTRUCTIVE: this layer does not replace existing exercise logic.
  It provides the contracts we will migrate to module-by-module.
*/
(function(global){
  'use strict';
  if(global.AW && global.AW.version) return;

  const CONFIG = {
    version: '15.0-architecture-core',
    reference: 'V14.87',
    schemaVersion: 1,
    contentSchemaVersion: 1,
    featureFlags: {
      accounts: false,
      cloudSync: false,
      notifications: false,
      analytics: false,
      remoteConfig: false,
      ads: false,
      premium: false,
      payments: false,
      diagnosticMode: false
    },
    capacity: {
      minReadableFontPx: 16,
      maxChoiceCount: 3,
      mobileFirst: true
    }
  };

  const events = Object.create(null);
  const state = {
    session: { active:false, screen:null, level:null, lesson:null, exercise:null },
    version: CONFIG.version
  };

  function on(name, handler){
    (events[name] ||= new Set()).add(handler);
    return function(){ events[name] && events[name].delete(handler); };
  }
  function emit(name, payload){
    (events[name] || []).forEach(function(handler){
      try { handler(payload); } catch(e) { /* isolated event handlers */ }
    });
  }

  function readStorage(key, fallback){
    try {
      const value = localStorage.getItem(key);
      return value === null ? fallback : value;
    } catch(e){ return fallback; }
  }

  function snapshot(){
    return {
      ui: readStorage('aw_ui_clean','العربية'),
      learningLanguage: readStorage('aw_lang_clean','English'),
      level: readStorage('aw_level_clean','A1'),
      xp: Number(readStorage('aw_xp_clean','0')) || 0,
      learned: Number(readStorage('aw_learned_clean','0')) || 0,
      attempts: Number(readStorage('aw_attempts_clean','0')) || 0,
      correct: Number(readStorage('aw_correct_clean','0')) || 0,
      session: Object.assign({}, state.session)
    };
  }

  const modules = Object.create(null);
  function register(name, api, dependencies){
    if(modules[name]) throw new Error('AW module already registered: '+name);
    modules[name] = { api: api || {}, dependencies: dependencies || [] };
    emit('module:registered', {name:name});
    return modules[name];
  }
  function moduleStatus(){
    return Object.keys(modules).map(function(name){
      return {name:name, dependencies:modules[name].dependencies.slice()};
    });
  }

  function healthCheck(){
    const screens = Array.from(document.querySelectorAll('.screen')).map(function(x){return x.id;});
    const requiredScreens = ['home','settings','learn','listen','match','wordgame','sentenceIntro','sentenceBuild','review','complete','progress'];
    const missingScreens = requiredScreens.filter(function(id){return screens.indexOf(id)<0;});
    const requiredStorage = ['aw_ui_clean','aw_lang_clean','aw_level_clean','aw_xp_clean','aw_learned_clean','aw_attempts_clean','aw_correct_clean','aw_mistakes_clean','aw_review_clean'];
    const result = {
      reference: CONFIG.reference,
      version: CONFIG.version,
      screens: screens,
      missingScreens: missingScreens,
      storageKeys: requiredStorage.filter(function(k){return readStorage(k,null)!==null;}),
      featureFlags: Object.assign({}, CONFIG.featureFlags),
      modules: moduleStatus(),
      ok: missingScreens.length===0
    };
    emit('diagnostic:health', result);
    return result;
  }

  const AW = global.AW = {
    version: CONFIG.version,
    reference: CONFIG.reference,
    config: CONFIG,
    state: state,
    events: { on:on, emit:emit },
    storage: { snapshot:snapshot },
    modules: { register:register, status:moduleStatus },
    diagnostic: { healthCheck:healthCheck }
  };

  register('Core', {config:CONFIG, state:state, events:AW.events});
  register('Persistence', {snapshot:snapshot}, ['Core']);
  register('UI', {}, ['Core']);
  register('Curriculum', {}, ['Core']);
  register('Content', {}, ['Core']);
  register('ExerciseEngine', {}, ['Content','Curriculum']);
  register('Revision', {}, ['ExerciseEngine','Persistence']);
  register('Progress', {}, ['Persistence']);
  register('Languages', {}, ['Content']);
  register('Pronunciation', {}, ['Languages']);

  document.addEventListener('DOMContentLoaded', function(){
    const result = healthCheck();
    global.__AW_V15_HEALTH__ = result;
  });
})(window);
</script>


<script id="AW_V15_PHASE1_CORE_UPGRADE">
/* Animal World V15.1 — Phase 1 Core Upgrade
   Non-destructive architecture layer. Existing UI/exercise functions remain authoritative
   until each module is migrated and regression-tested. */
(function(global){
  'use strict';
  var AW=global.AW;
  if(!AW) return;

  var NS='aw_v15_';
  var SESSION_KEY=NS+'session_v1';
  var SETTINGS_KEY=NS+'settings_v1';
  var memory={};

  function safeParse(raw,fallback){
    try{return raw==null?fallback:JSON.parse(raw);}catch(e){return fallback;}
  }
  function saveJSON(key,value){
    try{localStorage.setItem(key,JSON.stringify(value));return true;}catch(e){return false;}
  }
  function loadJSON(key,fallback){
    try{return safeParse(localStorage.getItem(key),fallback);}catch(e){return fallback;}
  }

  /* Central, versioned configuration API. */
  AW.config.get=function(path,fallback){
    if(!path) return AW.config;
    var cur=AW.config, parts=String(path).split('.');
    for(var i=0;i<parts.length;i++){
      if(cur==null || !(parts[i] in cur)) return fallback;
      cur=cur[parts[i]];
    }
    return cur;
  };
  AW.config.setRuntime=function(path,value){
    var parts=String(path).split('.'), cur=AW.config;
    for(var i=0;i<parts.length-1;i++){
      if(!cur[parts[i]] || typeof cur[parts[i]]!=='object') cur[parts[i]]={};
      cur=cur[parts[i]];

<script id="AW_V15_SESSION_RESUME">
/* V15.2 — Real Session Resume, isolated from the legacy exercise engine. */
(function(global){
  'use strict';
  var KEY='aw_v15_session_resume_v1';
  var saving=false;
  var stageToScreen={learn:'learn',listen:'listen',match:'match',word:'wordgame',sentence:'sentenceIntro',build:'sentenceBuild'};

  function snapshot(){
    try{
      return {
        schema:1, savedAt:Date.now(), active:true,
        level:typeof level!=='undefined'?level:null,
        lang:typeof lang!=='undefined'?lang:null,
        ui:typeof ui!=='undefined'?ui:null,
        order:typeof order!=='undefined'?order.slice():null,
        pos:typeof pos!=='undefined'?pos:0,
        stage:typeof stage!=='undefined'?stage:'learn',
        currentId:typeof currentId!=='undefined'?currentId:null,
        missing:typeof missing!=='undefined'?missing:'',
        built:typeof built!=='undefined'?built.slice():[]
      };
    }catch(e){ return null; }
  }
  function saveSession(){
    if(saving)return false; saving=true;
    try{var data=snapshot(); if(!data)return false; localStorage.setItem(KEY,JSON.stringify(data)); return true;}
    catch(e){return false;} finally{saving=false;}
  }
  function loadSession(){
    try{var raw=localStorage.getItem(KEY);return raw?JSON.parse(raw):null;}catch(e){return null;}
  }
  function clearSession(){try{localStorage.removeItem(KEY);}catch(e){}}
  function valid(data){
    return !!(data && data.active && Array.isArray(data.order) && data.order.length &&
      typeof data.pos==='number' && data.pos>=0 && data.pos<data.order.length &&
      stageToScreen[data.stage]);
  }
  function resume(){
    var data=loadSession(); if(!valid(data))return false;
    try{
      if(typeof level!=='undefined'&&data.level)level=data.level;
      if(typeof lang!=='undefined'&&data.lang)lang=data.lang;
      if(typeof ui!=='undefined'&&data.ui)ui=data.ui;
      order=data.order.slice(); pos=data.pos; stage=data.stage;
      if(typeof currentId!=='undefined'&&data.currentId)currentId=data.currentId;
      if(typeof missing!=='undefined')missing=data.missing||'';
      if(typeof built!=='undefined')built=Array.isArray(data.built)?data.built.slice():[];
      if(typeof locked!=='undefined')locked=false;
      if(typeof go==='function')go(stageToScreen[data.stage]);
      if(global.AW&&global.AW.session)global.AW.session.lastResume=data.savedAt;
      return true;
    }catch(e){return false;}
  }

  function installContinue(){
    var homeActions=document.getElementById('homeActions'); if(!homeActions)return;
    var old=document.getElementById('awContinueSession'); if(old)old.remove();
    var data=loadSession(); if(!valid(data))return;
    var b=document.createElement('button'); b.id='awContinueSession'; b.className='secondary';
    b.textContent=(typeof t==='function'?t('continue'):'Continue Lesson →');
    b.onclick=function(){ if(!resume()) installContinue(); };
    homeActions.insertBefore(b,homeActions.firstChild);
  }

  /* Save at meaningful state transitions without replacing legacy functions. */
  function patch(name){
    var base=global[name]; if(typeof base!=='function'||base.__awSessionWrapped)return;
    var wrapped=function(){var r=base.apply(this,arguments); try{saveSession();}catch(e){} return r;};
    wrapped.__awSessionWrapped=true; global[name]=wrapped;
  }

  function install(){
    patch('go'); patch('listenNext'); patch('matchNext'); patch('wordNext');
    patch('sentenceNext'); patch('buildNext');
    window.addEventListener('pagehide',saveSession);
    window.addEventListener('beforeunload',saveSession);
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')saveSession();});
    installContinue();
    if(global.AW){
      global.AW.session=global.AW.session||{};
      global.AW.session.saveResume=saveSession;
      global.AW.session.loadResume=loadSession;
      global.AW.session.resume=resume;
      global.AW.session.clearResume=clearSession;
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',install,{once:true});else install();
})(window);
</script>

(function(){
  function fitListenText(){
    var box=document.getElementById('listenChoices');
    if(!box) return;
    box.querySelectorAll('.animalChoiceName').forEach(function(el){
      var card=el.closest('button.choice') || el.closest('button');
      if(!card) return;
      var available=Math.max(20, card.clientWidth-14);
      var text=(el.textContent||'').trim();
      if(!text) return;

      var cs=getComputedStyle(el);
      var family=cs.fontFamily;
      var weight=cs.fontWeight;
      var canvas=fitListenText.canvas || (fitListenText.canvas=document.createElement('canvas'));
      var ctx=canvas.getContext('2d');
      var maxSize=26, minSize=13;
      ctx.font=weight+' '+maxSize+'px '+family;
      var measured=ctx.measureText(text).width;
      var size=measured>0 ? maxSize*Math.min(1,available/measured) : maxSize;
      size=Math.max(minSize,Math.min(maxSize,size));

      el.style.fontSize=size.toFixed(2)+'px';
      el.style.overflow='hidden';

      /* Final browser measurement catches Arabic shaping/font differences. */
      var guard=0;
      while(el.scrollWidth>available && size>minSize && guard++<30){
        size-=0.5;
        el.style.fontSize=size.toFixed(2)+'px';
      }
    });
  }

  window.fitListenText=fitListenText;
  window.addEventListener('resize',fitListenText);
  window.addEventListener('orientationchange',fitListenText);
  document.addEventListener('DOMContentLoaded',function(){
    fitListenText();
    setTimeout(fitListenText,80);
    setTimeout(fitListenText,250);
  });
  var oldRender=window.renderListen;
  if(oldRender){
    window.renderListen=function(){
      var r=oldRender.apply(this,arguments);
      requestAnimationFrame(fitListenText);
      setTimeout(fitListenText,80);
      setTimeout(fitListenText,250);
      return r;
    };
  }
})();
</script>

<script>
/* V14.13 — per-card smart fitting for ALL languages, not Arabic only. */
(function(){
  function fitOne(el){
    const btn=el.closest('.choice,button');
    if(!btn)return;
    const icon=btn.querySelector('.animalChoiceIcon');
    if(icon) icon.style.fontSize='';
    el.style.fontSize='';
    el.style.whiteSpace='nowrap';
    el.style.overflow='hidden';
    const cardW=Math.max(70,btn.clientWidth);
    const cardH=Math.max(60,btn.clientHeight);
    /* Start with a readable size, then reduce only this label until it fits. */
    let size=Math.min(30,Math.max(20,cardW*.14));
    if(document.documentElement.dir==='rtl') size=Math.min(31,Math.max(21,cardW*.15));
    const min=14;
    el.style.fontSize=size+'px';
    const maxW=Math.max(35,cardW-10);
    while(el.scrollWidth>maxW && size>min){size-=1;el.style.fontSize=size+'px'}
    /* If the label is very short, allow it to grow, but never beyond card width. */
    let grow=size;
    while(grow<34){
      const next=grow+1; el.style.fontSize=next+'px';
      if(el.scrollWidth>maxW){el.style.fontSize=grow+'px';break}
      grow=next;
    }
    /* Keep enough vertical room for the label; shrink icon slightly only when needed. */
    if(icon){
      let iconSize=42;
      const availableH=cardH-18-Math.min(44,size*1.2);
      if(availableH<34) iconSize=Math.max(28,iconSize-(34-availableH));
      icon.style.fontSize=iconSize+'px';
    }
  }
  function fitAll(){document.querySelectorAll('#listenChoices .animalChoiceName,#matchChoices .animalChoiceName').forEach(fitOne)}
  window.fitAllChoiceText=fitAll;
  window.addEventListener('resize',fitAll);
  window.addEventListener('orientationchange',fitAll);
  document.addEventListener('DOMContentLoaded',()=>setTimeout(fitAll,50));
  const oldGo=window.go;
  if(oldGo){window.go=function(){const r=oldGo.apply(this,arguments);requestAnimationFrame(()=>{fitAll();setTimeout(fitAll,80)});return r}}
})();
</script>

<script id="AW_STAGE_PROGRESS_V31_JS">
(function(){
  'use strict';
  function stageKey(){
    var s=(typeof stage!=='undefined')?stage:'';
    if(s==='wordgame') return 'word';
    if(s==='sentenceIntro') return 'sentence';
    if(s==='sentenceBuild') return 'build';
    return s;
  }
  function total(){
    try{
      if(typeof questionTotal==='function') return questionTotal();
      if(typeof order!=='undefined' && Array.isArray(order) && order.length) return order.length;
      if(typeof A!=='undefined' && Array.isArray(A) && A.length) return A.length;
    }catch(e){}
    return 1;
  }
  function label(n,t){
    var u=(typeof ui!=='undefined' && ui)?ui:'العربية';
    if(u==='العربية') return n+' على '+t;
    if(u==='Français') return n+' sur '+t;
    return n+' of '+t;
  }
  function refresh(){
    var s=stageKey(), boxes=document.querySelectorAll('.awStageProgress');
    if(!boxes.length) return;
    var t=total(), p=Math.max(0,Math.min((typeof pos!=='undefined'?Number(pos):0),t-1)), n=p+1, w=(n/t)*100;
    boxes.forEach(function(box){
      var active=box.getAttribute('data-aw-stage')===s;
      box.style.display=active?'block':'none';
      if(active){
        var fill=box.querySelector('.awSPFill'), lab=box.querySelector('.awSPLabel');
        if(fill) fill.style.width=w+'%';
        if(lab) lab.textContent=label(n,t);
      }
    });
  }
  function kick(){setTimeout(refresh,0);setTimeout(refresh,80);}
  document.addEventListener('DOMContentLoaded',kick);
  window.addEventListener('load',kick);
  document.addEventListener('click',kick);
  var mo=new MutationObserver(kick);
  mo.observe(document.body,{subtree:true,childList:true,characterData:true});
  window.AW_refreshStageProgress=refresh;
})();
</script>

<script id="AW_CONTINUE_FIX_V1">
/* Continue Fix V1 — authoritative checkpoint after UI actions.
   Non-destructive: leaves the original prototype intact and adds a final session layer. */
(function(global){
  'use strict';
  var KEY='aw_v15_session_resume_v1';
  var screens={learn:'learn',listen:'listen',match:'match',word:'wordgame',sentence:'sentenceIntro',build:'sentenceBuild'};

  function snap(){
    try{
      return {schema:1,savedAt:Date.now(),active:true,
        level:typeof level!=='undefined'?level:null,
        lang:typeof lang!=='undefined'?lang:null,
        ui:typeof ui!=='undefined'?ui:null,
        order:typeof order!=='undefined'&&Array.isArray(order)?order.slice():null,
        pos:typeof pos!=='undefined'?Number(pos):0,
        stage:typeof stage!=='undefined'?stage:'learn',
        currentId:typeof currentId!=='undefined'?currentId:null,
        missing:typeof missing!=='undefined'?missing:'',
        built:typeof built!=='undefined'&&Array.isArray(built)?built.slice():[]};
    }catch(e){return null;}
  }
  function save(){
    var d=snap();
    if(!d || !Array.isArray(d.order) || !d.order.length || !screens[d.stage]) return false;
    try{localStorage.setItem(KEY,JSON.stringify(d));return true;}catch(e){return false;}
  }
  function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
  function valid(d){return !!(d&&d.active&&Array.isArray(d.order)&&d.order.length&&Number.isInteger(d.pos)&&d.pos>=0&&d.pos<d.order.length&&screens[d.stage]);}

  global.resumeSession=function(){
    var d=load();
    if(!valid(d)) return false;
    try{
      if(typeof level!=='undefined'&&d.level) level=d.level;
      if(typeof lang!=='undefined'&&d.lang) lang=d.lang;
      if(typeof ui!=='undefined'&&d.ui) ui=d.ui;
      order=d.order.slice(); pos=d.pos; stage=d.stage;
      if(typeof currentId!=='undefined'&&d.currentId) currentId=d.currentId;
      if(typeof missing!=='undefined') missing=d.missing||'';
      if(typeof built!=='undefined') built=Array.isArray(d.built)?d.built.slice():[];
      if(typeof locked!=='undefined') locked=false;
      if(typeof go==='function') go(screens[d.stage]);
      return true;
    }catch(e){return false;}
  };
  global.saveResumeSession=save;

  /* Save only after the user's click handler has finished changing stage/position. */
  document.addEventListener('click',function(){
    global.setTimeout(function(){
      try{
        var active=typeof stage!=='undefined' && screens[stage];
        if(active) save();
      }catch(e){}
    },0);

<script id="AW_V40_BUILD_SWIPE_RESTORE">
(function(){
  'use strict';
  var sx=0,sy=0,dragging=false,sourceBtn=null,ghost=null,moved=false,suppressClick=false;

  function inBuild(){return document.getElementById('sentenceBuild') && document.getElementById('sentenceBuild').offsetParent!==null;}
  function point(e){var t=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;return t;}
  function overBuilt(x,y){
    var box=document.getElementById('builtSentence');
    if(!box)return false;
    var r=box.getBoundingClientRect();
    return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
  }
  function makeGhost(btn,x,y){
    ghost=btn.cloneNode(true);ghost.classList.add('awSwipeGhost');
    ghost.disabled=false;ghost.style.width=btn.getBoundingClientRect().width+'px';
    ghost.style.left=(x-ghost.getBoundingClientRect().width/2)+'px';
    ghost.style.top=(y-22)+'px';
    document.body.appendChild(ghost);
  }
  function moveGhost(x,y){
    if(!ghost)return;
    ghost.style.left=(x-ghost.getBoundingClientRect().width/2)+'px';
    ghost.style.top=(y-22)+'px';
  }
  function clear(){
    if(ghost){ghost.remove();ghost=null;}
    dragging=false;sourceBtn=null;moved=false;
  }
  function start(e){
    if(!inBuild())return;
    var btn=e.currentTarget;
    if(!btn || btn.disabled)return;
    var p=point(e);sx=p.clientX;sy=p.clientY;sourceBtn=btn;dragging=true;moved=false;
  }
  function move(e){
    if(!dragging||!sourceBtn)return;
    var p=point(e),dx=p.clientX-sx,dy=p.clientY-sy;
    if(!moved && Math.hypot(dx,dy)<10)return;
    moved=true;
    if(!ghost)makeGhost(sourceBtn,p.clientX,p.clientY);
    moveGhost(p.clientX,p.clientY);
    if(e.cancelable)e.preventDefault();
  }
  function end(e){
    if(!dragging||!sourceBtn)return;
    var p=point(e),wasMoved=moved,btn=sourceBtn;
    if(wasMoved && overBuilt(p.clientX,p.clientY)){
      var x=btn.textContent;
      if(typeof window.addToken==='function')window.addToken(btn,x);
      suppressClick=true;
      setTimeout(function(){suppressClick=false;},450);
    }
    clear();
  }
  function bind(){
    var bank=document.getElementById('buildBank');
    if(!bank)return;
    bank.querySelectorAll('button').forEach(function(btn){
      if(btn.dataset.awSwipeBound==='1')return;
      btn.dataset.awSwipeBound='1';
      btn.addEventListener('pointerdown',start,{passive:true});
      btn.addEventListener('pointermove',move,{passive:false});
      btn.addEventListener('pointerup',end,{passive:true});
      btn.addEventListener('pointercancel',clear,{passive:true});
      btn.addEventListener('click',function(e){if(suppressClick)e.stopImmediatePropagation();});
    });
  }
  var observer=new MutationObserver(bind);
  function init(){bind();observer.observe(document.getElementById('buildBank')||document.body,{subtree:true,childList:true});}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
